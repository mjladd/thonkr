[package]
name = "thonkr"
version = "0.1.2"
edition = "2021"
# The floor the dependencies set. Cargo reports a clear message below it, and
# clippy reads this too, so it stops suggesting newer standard library calls.
# CI builds against exactly this version.
rust-version = "1.85"
description = "The thOnk_0+2 granular engine, reimplemented as a command line renderer."
repository = "https://github.com/mjladd/thonkr"
readme = "README.md"
keywords = ["audio", "granular", "synthesis", "aiff"]
categories = ["command-line-utilities", "multimedia::audio"]
license = "MIT"

[lib]
name = "thonkr"
path = "src/lib.rs"

[[bin]]
name = "thonkr"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Do not add panic = "abort" here. StreamWriter finalizes the output file from
# its Drop, which is what keeps a render playable when one unwinds. Aborting
# skips every destructor and would leave a broken header behind.

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = "3.5.2"
rand = "0.10.2"
rand_pcg = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
toml = "1.1.6"

[dev-dependencies]
serde_json = "1.0.151"

[target."cfg(unix)".dependencies]
libc = "0.2.189"
