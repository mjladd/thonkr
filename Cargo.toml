[package]
name = "thonkr"
version = "0.1.0"
edition = "2021"
description = "The thOnk_0+2 granular engine, reimplemented as a command line renderer."
repository = "https://github.com/mjladd/thonkr"
readme = "README.md"
keywords = ["audio", "granular", "synthesis", "aiff"]
categories = ["command-line-utilities", "multimedia::audio"]
license = "MIT"

[lib]
name = "thonkr"
path = "src/lib.rs"

[[bin]]
name = "thonkr"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = "3.5.2"
rand = "0.10.2"
rand_pcg = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
toml = "1.1.6"

[dev-dependencies]
serde_json = "1.0.151"

[target."cfg(unix)".dependencies]
libc = "0.2.189"
